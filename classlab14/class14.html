<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassLab14</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student's full name</h1>
    <h2>Window events</h2>
    <section class="maincontainer">
        <div class="gallerycontainer">
            <img class="gallaryimage" src="images/spring.jpg" alt="image of spring">
            <img class="gallaryimage" src="images/summer.jpg" alt="image of summer">
            <img class="gallaryimage" src="images/fall.jpg" alt="image of a pumpkin in fall">
            <img class="gallaryimage" src="images/winter.jpg" alt="image of winter">
        </div>
        
        <button class="btnright">&#x276F;</button>
        <button class="btnleft">&#x276E;</button>
    </section>

    <h2>Form events</h2>
    <form id="myForm">
        <div class="formsession">
             <label for="username">Username: </label>
            <input type="text" id="username" name="username" placeholder="Type username...">
        </div>
       
        <div class="formsession">
            <label for="password">Password: </label>
            <input type="text" id="password" placeholder="Enter a password...">
            <p class="passwordmsg">Password must be at least 8 characters</p>
            <div id="passwordError">error</div>
        </div>
       
        <button type="submit" class="submitbtn">Submit</button>
    </form>

    <!-- display message using the data from the form-->
     <div class="msg"> 
   
     </div>

    <script src="script.js"></script>
</body>
</html>
